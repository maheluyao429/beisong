<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#4f46e5" />
<title>背诵打卡助手</title>
<!-- 引入 SheetJS 用于解析 Excel -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --primary:#4f46e5;
    --primary-2:#6366f1;
    --primary-gradient:linear-gradient(135deg,#6366f1 0%,#4f46e5 100%);
    --ok:#10b981;
    --ok-gradient:linear-gradient(135deg,#34d399 0%,#10b981 100%);
    --no:#ef4444;
    --no-gradient:linear-gradient(135deg,#f87171 0%,#ef4444 100%);
    --ink:#0f172a;
    --ink-2:#334155;
    --muted:#64748b;
    --muted-2:#94a3b8;
    --line:#e2e8f0;
    --line-soft:#eef2f7;
    --bg:#f1f5f9;
    --card:#ffffff;
    --radius:16px;
    --shadow:0 1px 3px rgba(15,23,42,.04),0 10px 28px -14px rgba(15,23,42,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg);
    background-image:
      radial-gradient(at 0% 0%, rgba(99,102,241,.10) 0px, transparent 55%),
      radial-gradient(at 100% 0%, rgba(59,130,246,.08) 0px, transparent 55%),
      radial-gradient(at 50% 100%, rgba(16,185,129,.05) 0px, transparent 60%);
    background-attachment:fixed;
    color:var(--ink);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }

  /* ===== 顶部 ===== */
  .app-header{
    position:relative;overflow:hidden;
    background:var(--primary-gradient);color:#fff;
    padding:22px 20px 30px;
    padding-top:calc(22px + env(safe-area-inset-top));
  }
  .app-header::before{
    content:"";position:absolute;top:-70px;right:-40px;
    width:220px;height:220px;background:rgba(255,255,255,.10);border-radius:50%;
  }
  .header-inner{
    position:relative;z-index:1;max-width:900px;margin:0 auto;
    display:flex;align-items:center;gap:14px;
  }
  .logo{
    width:48px;height:48px;flex-shrink:0;border-radius:15px;
    background:rgba(255,255,255,.22);backdrop-filter:blur(6px);
    display:grid;place-items:center;font-size:26px;
  }
  .header-text{flex:1;min-width:0}
  .header-text h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.4px}
  .header-text p{margin:3px 0 0;font-size:12.5px;opacity:.82}
  .header-actions{display:flex;gap:8px;flex-shrink:0}
  .header-btn{
    height:42px;border:0;border-radius:13px;
    background:rgba(255,255,255,.18);color:#fff;font-size:14px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;
    padding:0 12px;transition:background .18s ease;
  }
  .header-btn:hover{background:rgba(255,255,255,.3)}

  /* ===== 班级切换栏 ===== */
  .class-bar{
    background:#fff;padding:10px 14px;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:25;
    box-shadow:0 2px 8px rgba(15,23,42,.03);
  }
  .class-bar-inner{
    max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px;
  }
  .class-select{
    flex:1;padding:8px 12px;border-radius:10px;border:1.5px solid var(--primary-2);
    font-size:15px;font-weight:600;color:var(--primary);background:#f5f3ff;
    outline:none;appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 6l4 4 4-4'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:36px;
  }
  .btn-manage{
    padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink-2);font-size:14px;font-weight:500;
    cursor:pointer;white-space:nowrap;
  }

  /* ===== 标签栏 ===== */
  .tabs{
    position:sticky;top:53px;z-index:20;padding:10px 12px;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(226,232,240,.8);
  }
  .tabs-inner{max-width:900px;margin:0 auto;display:flex;gap:8px}
  .tab-btn{
    flex:1;padding:10px 6px;border:0;border-radius:11px;background:transparent;
    font-family:inherit;font-size:14.5px;font-weight:500;color:var(--muted);
    cursor:pointer;transition:all .22s ease;
  }
  .tab-btn.active{
    background:var(--primary-gradient);color:#fff;font-weight:600;
    box-shadow:0 6px 16px -6px rgba(79,70,229,.65);
  }

  /* ===== 布局 ===== */
  main{max-width:900px;margin:0 auto;padding:16px 14px 90px}
  .view{animation:fadeUp .28s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ===== 卡片 ===== */
  .card{
    background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;
    border:1px solid rgba(226,232,240,.75);box-shadow:var(--shadow);
  }
  .card h3{
    margin:0 0 14px;font-size:15px;font-weight:700;color:var(--ink-2);
    display:flex;align-items:center;gap:9px;
  }
  .card h3::before{
    content:"";width:4px;height:16px;border-radius:2px;
    background:var(--primary-gradient);flex-shrink:0;
  }
  .hint{color:var(--muted);font-size:13px;margin:0 0 10px;line-height:1.6}
  .empty{color:var(--muted-2);font-size:14px;text-align:center;padding:30px 0;margin:0}

  /* ===== 表单 ===== */
  input,textarea,select{
    width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:11px;
    font-size:16px;font-family:inherit;background:#f8fafc;color:var(--ink);transition:all .2s ease;
  }
  @media (hover:hover) and (pointer:fine){ input,textarea,select{font-size:15px} }
  input:focus,textarea:focus,select:focus{
    outline:none;border-color:var(--primary-2);background:#fff;
    box-shadow:0 0 0 4px rgba(99,102,241,.12);
  }
  textarea{resize:vertical;min-height:80px;line-height:1.6}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .row>*{flex:1;min-width:130px}

  /* ===== 按钮 ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 18px;border:0;border-radius:11px;background:var(--primary-gradient);
    color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
    transition:all .2s ease;box-shadow:0 6px 16px -6px rgba(79,70,229,.7);
    min-height:44px;
  }
  .btn:active{transform:scale(.98)}
  .btn-ghost{background:#eef2ff;color:var(--primary);box-shadow:none}
  .btn-sm{padding:8px 14px;font-size:13.5px;border-radius:9px;min-height:38px}
  .file-label{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 18px;border-radius:11px;background:#eef2ff;color:var(--primary);
    font-size:15px;font-weight:600;cursor:pointer;min-height:44px;flex:1;
  }

  /* ===== 学生与作业列表 ===== */
  .stu-item{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:13px;transition:background .16s}
  .stu-item:hover{background:#f8fafc}
  .avatar{
    width:40px;height:40px;flex-shrink:0;border-radius:13px;
    background:linear-gradient(135deg,#e0e7ff 0%,#c7d2fe 100%);
    color:#4338ca;display:grid;place-items:center;font-weight:700;font-size:16px;
  }
  .stu-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .stu-name{font-size:15.5px;font-weight:600;color:var(--ink)}
  .stu-no{font-size:12px;color:var(--muted-2)}
  .icon-btn{
    width:38px;height:38px;flex-shrink:0;border:0;border-radius:10px;background:transparent;
    color:var(--muted-2);display:grid;place-items:center;cursor:pointer;transition:all .18s ease;
  }
  .icon-btn:hover{background:#fee2e2;color:#ef4444}

  .as-item{display:flex;align-items:center;gap:13px;padding:11px 8px;border-radius:14px;transition:background .16s}
  .as-item:hover{background:#f8fafc}
  .as-badge{
    width:50px;height:54px;flex-shrink:0;border-radius:13px;
    background:linear-gradient(160deg,#eef2ff 0%,#e0e7ff 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e0e7ff;
  }
  .as-day{font-size:19px;font-weight:800;color:#4338ca;line-height:1}
  .as-mon{font-size:10.5px;color:#6366f1;font-weight:600;margin-top:2px}
  .as-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .as-title{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .as-meta{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot.ok{background:var(--ok)}
  .dot.no{background:var(--no)}
  .dot.mid{background:var(--muted-2)}

  /* ===== 打卡页 ===== */
  .check-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .check-back{width:42px;height:42px;flex-shrink:0;border:0;border-radius:12px;background:#eef2ff;color:var(--primary);display:grid;place-items:center;cursor:pointer;font-size:18px;}
  .progress-wrap{margin:4px 0 14px}
  .progress-bar{height:10px;background:#eef2f7;border-radius:6px;overflow:hidden}
  .progress-bar>div{height:100%;width:0;background:var(--ok-gradient);border-radius:6px;transition:width .35s}
  .progress-text{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px}
  .progress-text b{color:var(--ink-2);font-weight:600}

  .check-row{display:flex;align-items:center;gap:11px;padding:8px;border-radius:13px;}
  .check-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .check-name{font-size:15.5px;font-weight:600;color:var(--ink)}
  .check-actions{display:flex;gap:7px;flex-shrink:0}
  .check-btn{
    padding:9px 16px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
    font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;min-height:40px;
  }
  .check-btn.done.active{background:var(--ok-gradient);border-color:transparent;color:#fff;font-weight:600;}
  .check-btn.miss.active{background:var(--no-gradient);border-color:transparent;color:#fff;font-weight:600;}

  /* ===== 总览 ===== */
  .range-bar{display:flex;gap:7px}
  .range-btn{
    flex:1;padding:9px 0;border:1.5px solid var(--line);border-radius:10px;background:#fff;
    font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;min-height:40px;
  }
  .range-btn.active{background:var(--primary-gradient);border-color:transparent;color:#fff;font-weight:600;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat{background:#f8fafc;border:1px solid var(--line-soft);border-radius:14px;padding:15px 6px;text-align:center;}
  .stat-num{font-size:23px;font-weight:800;line-height:1.15;color:var(--ink);}
  .stat-label{font-size:12px;color:var(--muted);margin-top:3px;}

  .table-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
  th{padding:10px;text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);background:#f8fafc;white-space:nowrap;}
  td{padding:11px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap;color:var(--ink-2)}
  .c-ok{color:var(--ok);font-weight:700}
  .c-no{color:var(--no);font-weight:700}
  .c-muted{color:var(--muted-2)}
  .mini-bar{display:inline-block;width:54px;height:6px;background:#eef2f7;border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:7px}
  .mini-bar>span{display:block;height:100%;background:var(--primary-gradient);border-radius:3px;transition:width .3s}

  /* ===== Toast ===== */
  #toast{
    position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:#0f172a;color:#fff;padding:12px 22px;border-radius:13px;font-size:14px;font-weight:500;
    opacity:0;transition:all .3s;pointer-events:none;z-index:300;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ===== 模态框 ===== */
  .modal-mask{
    position:fixed;inset:0;z-index:250;background:rgba(15,23,42,.45);
    backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-mask[hidden]{display:none}
  .modal{
    background:#fff;border-radius:18px;padding:20px;width:100%;max-width:380px;
    box-shadow:0 20px 50px -20px rgba(15,23,42,.6);max-height:80vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 10px;font-size:17px}
  .modal-actions{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  
  .class-manage-item{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line);}
  .class-manage-item:last-child{border-bottom:0}

  @media (max-width:520px){
    .app-header{padding:18px 16px 26px}
    .logo{width:44px;height:44px;font-size:23px}
    .header-text h1{font-size:17.5px}
    .header-actions .header-btn{padding:0 10px;font-size:13px;height:38px}
    main{padding:14px 10px 90px}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .class-select{font-size:14px;padding:7px 10px;padding-right:30px}
    .check-btn{padding:9px 13px;font-size:13.5px}
    .tabs{top:49px}
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="logo">📖</div>
    <div class="header-text">
      <h1>背诵打卡助手</h1>
      <p>多班级管理 · 支持Excel导入</p>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="btnBackup">💾 备份</button>
    </div>
  </div>
</header>

<!-- 班级切换栏 -->
<div class="class-bar">
  <div class="class-bar-inner">
    <select id="classSelect" class="class-select"></select>
    <button class="btn-manage" id="btnManageClasses">⚙️ 管理班级</button>
  </div>
</div>

<nav class="tabs">
  <div class="tabs-inner">
    <button class="tab-btn active" data-tab="students">学生名单</button>
    <button class="tab-btn" data-tab="assignments">背诵作业</button>
    <button class="tab-btn" data-tab="overview">总览统计</button>
  </div>
</nav>

<main>
  <!-- 学生名单 -->
  <section id="view-students" class="view">
    <div class="card">
      <h3>导入学生到当前班级</h3>
      <p class="hint">支持从 Excel (第一列学号，第二列姓名，或直接一列姓名) 导入，也可手动粘贴。重复姓名+学号自动跳过。</p>
      <div class="row" style="margin-bottom:12px;">
        <label class="file-label" for="excelUpload">📁 选择 Excel 文件</label>
        <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" hidden />
      </div>
      <textarea id="importText" placeholder="或在此手动粘贴：&#10;01 张三&#10;02 李四"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="btnImport">手动导入</button>
      </div>
    </div>
    <div class="card">
      <h3>当前班级名单 · 共 <span id="studentCount">0</span> 人</h3>
      <div id="studentList"></div>
    </div>
  </section>

  <!-- 背诵作业 -->
  <section id="view-assignments" class="view" hidden>
    <div id="paneList">
      <div class="card">
        <h3>发布背诵作业</h3>
        <input id="asTitle" placeholder="背诵篇目，如：《赤壁赋》全文" />
        <div class="row" style="margin-top:9px">
          <input id="asDate" type="date" />
        </div>
        <textarea id="asContent" placeholder="备注 / 要求（选填）" style="min-height:60px;margin-top:9px"></textarea>
        <button class="btn" id="btnCreate" style="margin-top:12px;width:100%">发布作业</button>
      </div>
      <div class="card">
        <h3>作业列表</h3>
        <div id="assignmentList"></div>
      </div>
    </div>

    <div id="paneCheck" hidden>
      <div class="card">
        <div class="check-head">
          <button class="check-back" id="btnBack" title="返回">←</button>
          <div class="check-title-wrap">
            <div id="ckTitle" class="check-title"></div>
            <div id="ckMeta" class="check-meta"></div>
          </div>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar"><div id="ckProgressBar"></div></div>
          <div id="ckProgressText" class="progress-text"></div>
        </div>
        <button class="btn btn-ghost btn-sm" id="btnMarkAllDone" style="width:100%">✓ 全部标记为已背</button>
      </div>
      <div class="card"><div id="ckList"></div></div>
    </div>
  </section>

  <!-- 总览统计 -->
  <section id="view-overview" class="view" hidden>
    <div class="card">
      <div class="range-bar">
        <button class="range-btn active" data-range="today">今日</button>
        <button class="range-btn" data-range="week">本周</button>
        <button class="range-btn" data-range="month">本月</button>
        <button class="range-btn" data-range="all">全部</button>
      </div>
      <div class="row" style="margin-top:12px">
        <input type="date" id="ovFrom" />
        <input type="date" id="ovTo" />
        <button class="btn btn-sm" id="btnCustom" style="flex:0 0 auto">查询</button>
      </div>
    </div>
    <div class="card"><h3>总体情况</h3><div class="stat-grid" id="ovStats"></div></div>
    <div class="card"><h3>每日背诵情况</h3><div class="table-wrap"><table id="ovDaily"></table></div></div>
    <div class="card"><h3>学生个人统计</h3><div class="table-wrap"><table id="ovStudents"></table></div></div>
    <div class="card"><h3>作业明细</h3><div class="table-wrap"><table id="ovAssignments"></table></div></div>
  </section>
</main>

<!-- 班级管理模态框 -->
<div class="modal-mask" id="classModal" hidden>
  <div class="modal">
    <h3>⚙️ 管理班级</h3>
    <div id="classManageList" style="margin-bottom:14px;max-height:200px;overflow-y:auto;"></div>
    <div class="row" style="margin-bottom:14px">
      <input type="text" id="newClassName" placeholder="输入新班级名称，如：高一(3)班" />
    </div>
    <div class="modal-actions">
      <button class="btn" id="btnAddClass">添加班级</button>
      <button class="btn btn-ghost" id="btnCloseClassModal">关闭</button>
    </div>
  </div>
</div>

<!-- 备份模态框 -->
<div class="modal-mask" id="backupModal" hidden>
  <div class="modal">
    <h3>💾 数据备份与恢复</h3>
    <div class="backup-stat" id="backupStat" style="background:#f8fafc;border-radius:12px;padding:12px;font-size:13px;color:var(--muted);margin-bottom:14px;"></div>
    <div class="modal-actions">
      <button class="btn" id="btnExport">导出备份文件</button>
      <label class="file-label" for="fileImport">导入备份文件</label>
      <input type="file" id="fileImport" accept=".json" hidden />
      <button class="btn btn-ghost" id="btnCloseModal">关闭</button>
    </div>
  </div>
</div>

<script>
/* ==================================================================
   本地数据层 (多班级支持)
   ================================================================== */
const STORAGE_KEY = 'recite_app_multi_v1'; // 更换了Key，但做了旧版兼容
const OLD_KEY = 'recite_app_v1';
const LAST_BACKUP_KEY = 'recite_last_backup';

function emptyDB(){
  return { 
    classes: [{ id: 1, name: '默认班级' }], 
    currentClassId: 1,
    students: [], 
    assignments: [], 
    records: [], 
    seq: { class: 1, student: 0, assignment: 0 } 
  };
}

function loadDB(){
  let d = null;
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) raw = localStorage.getItem(OLD_KEY); // 尝试读取旧版数据
    if (raw) d = JSON.parse(raw);
  } catch(e) { console.warn('读取失败', e); }
  
  if (!d || typeof d !== 'object') return emptyDB();

  // 如果是旧版数据（没有 classes），进行迁移
  if (!d.classes) {
    d = {
      classes: [{ id: 1, name: '默认班级(迁移)' }],
      currentClassId: 1,
      students: d.students || [],
      assignments: d.assignments || [],
      records: d.records || [],
      seq: { class: 1, student: d.seq?.student || 0, assignment: d.seq?.assignment || 0 }
    };
    // 给旧数据打上班级标签
    d.students.forEach(s => s.classId = 1);
    d.assignments.forEach(a => a.classId = 1);
  }

  // 补全缺失字段
  d.classes = Array.isArray(d.classes) && d.classes.length ? d.classes : [{ id: 1, name: '默认班级' }];
  d.currentClassId = d.classes.some(c => c.id === d.currentClassId) ? d.currentClassId : d.classes[0].id;
  d.students = Array.isArray(d.students) ? d.students : [];
  d.assignments = Array.isArray(d.assignments) ? d.assignments : [];
  d.records = Array.isArray(d.records) ? d.records : [];
  d.seq = d.seq || { class: 1, student: 0, assignment: 0 };
  
  return d;
}

let DB = loadDB();
function saveDB(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } 
  catch (e) { toast('保存失败：空间不足'); }
}
function nextId(type){
  DB.seq[type] = (DB.seq[type] || 0) + 1;
  return DB.seq[type];
}

/* 班级操作 */
function getClasses(){ return DB.classes; }
function addClass(name){
  if (!name.trim()) return false;
  const id = nextId('class');
  DB.classes.push({ id, name: name.trim() });
  saveDB();
  return true;
}
function deleteClass(id){
  if (DB.classes.length <= 1) { toast('至少保留一个班级'); return false; }
  DB.classes = DB.classes.filter(c => c.id !== id);
  // 删除该班级下的所有数据
  const stuIds = DB.students.filter(s => s.classId === id).map(s => s.id);
  DB.students = DB.students.filter(s => s.classId !== id);
  DB.assignments = DB.assignments.filter(a => a.classId !== id);
  DB.records = DB.records.filter(r => !stuIds.includes(r.studentId));
  
  if (DB.currentClassId === id) DB.currentClassId = DB.classes[0].id;
  saveDB();
  return true;
}

/* 学生 */
function getStudents(){
  return DB.students.filter(s => s.classId === DB.currentClassId).map(s => ({ ...s }));
}
function addStudents(items){
  const existing = new Set(DB.students.filter(s => s.classId === DB.currentClassId).map(s => s.name + '\u0000' + (s.no || '')));
  let added = 0;
  items.forEach(it => {
    const key = it.name + '\u0000' + (it.no || '');
    if (existing.has(key)) return;
    existing.add(key);
    DB.students.push({ id: nextId('student'), classId: DB.currentClassId, no: it.no || '', name: it.name });
    added++;
  });
  if (added) saveDB();
  return added;
}
function deleteStudent(id){
  DB.students = DB.students.filter(s => s.id !== id);
  DB.records = DB.records.filter(r => r.studentId !== id);
  saveDB();
}

/* 作业 */
function getAssignments(){
  return DB.assignments.filter(a => a.classId === DB.currentClassId).map(a => {
    const recs = DB.records.filter(r => r.assignmentId === a.id);
    const done = recs.filter(r => r.status === 'done').length;
    const miss = recs.filter(r => r.status === 'miss').length;
    const total = DB.students.filter(s => s.classId === DB.currentClassId).length;
    return { ...a, done, miss, total };
  }).sort((a, b) => {
    const d = b.date.localeCompare(a.date);
    return d !== 0 ? d : (b.id - a.id);
  });
}
function addAssignment({ title, content, date }){
  const a = { id: nextId('assignment'), classId: DB.currentClassId, title, content: content || '', date };
  DB.assignments.push(a);
  saveDB();
  return a;
}
function deleteAssignment(id){
  DB.assignments = DB.assignments.filter(a => a.id !== id);
  DB.records = DB.records.filter(r => r.assignmentId !== id);
  saveDB();
}
function getAssignmentDetail(id){
  const assignment = DB.assignments.find(a => a.id === id);
  if (!assignment) throw new Error('作业不存在');
  const students = DB.students.filter(s => s.classId === DB.currentClassId).map(s => {
    const rec = DB.records.find(r => r.assignmentId === id && r.studentId === s.id);
    return { id: s.id, no: s.no, name: s.name, status: rec ? rec.status : null };
  });
  return { assignment: { ...assignment }, students };
}

/* 打卡 */
function setRecord(assignmentId, studentId, status){
  DB.records = DB.records.filter(r => !(r.assignmentId === assignmentId && r.studentId === studentId));
  if (status === 'done' || status === 'miss'){
    DB.records.push({ assignmentId, studentId, status });
  }
  saveDB();
}
function bulkRecord(assignmentId, studentIds, status){
  const set = new Set(studentIds);
  DB.records = DB.records.filter(r => !(r.assignmentId === assignmentId && set.has(r.studentId)));
  studentIds.forEach(sid => DB.records.push({ assignmentId, studentId: sid, status }));
  saveDB();
}

/* 总览 (只统计当前班级) */
function getOverview(from, to){
  const classStudents = DB.students.filter(s => s.classId === DB.currentClassId);
  const classAsgs = DB.assignments.filter(a => a.classId === DB.currentClassId && a.date >= from && a.date <= to);
  const asgIdSet = new Set(classAsgs.map(a => a.id));
  const stuIdSet = new Set(classStudents.map(s => s.id));
  const recs = DB.records.filter(r => asgIdSet.has(r.assignmentId) && stuIdSet.has(r.studentId));

  const recMap = new Map();
  recs.forEach(r => {
    if (!recMap.has(r.assignmentId)) recMap.set(r.assignmentId, { done: 0, miss: 0 });
    const m = recMap.get(r.assignmentId);
    if (r.status === 'done') m.done++;
    else if (r.status === 'miss') m.miss++;
  });
  const totalStu = classStudents.length;
  const assignmentStats = classAsgs.map(a => {
    const m = recMap.get(a.id) || { done: 0, miss: 0 };
    return { ...a, done: m.done, miss: m.miss, total: totalStu, unmarked: Math.max(0, totalStu - m.done - m.miss) };
  });

  const dayMap = new Map();
  classAsgs.forEach(a => {
    if (!dayMap.has(a.date)) dayMap.set(a.date, { date: a.date, assignments: 0, done: 0, miss: 0, unmarked: 0 });
    const day = dayMap.get(a.date);
    const m = recMap.get(a.id) || { done: 0, miss: 0 };
    day.assignments++;
    day.done += m.done;
    day.miss += m.miss;
    day.unmarked += Math.max(0, totalStu - m.done - m.miss);
  });
  const daily = Array.from(dayMap.values()).sort((a, b) => a.date.localeCompare(b.date));
  
  const studentStats = classStudents.map(s => {
    const sr = recs.filter(r => r.studentId === s.id);
    const done = sr.filter(r => r.status === 'done').length;
    const miss = sr.filter(r => r.status === 'miss').length;
    const total = classAsgs.length;
    return { id: s.id, no: s.no, name: s.name, done, miss, total, unmarked: Math.max(0, total - done - miss) };
  });
  return { assignments: assignmentStats, students: studentStats, daily };
}

function pad(n){ return String(n).padStart(2, '0'); }
function fmtDate(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today(){ return fmtDate(new Date()); }
function weekStart(){ const d = new Date(); d.setDate(d.getDate() - (d.getDay()+6)%7); return fmtDate(d); }
function monthStart(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-01'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initial(name){ return name ? String(name).trim().charAt(0) : '?'; }
function dateParts(str){ const p = String(str||'').split('-'); return p.length===3 ? { day:p[2], mon:parseInt(p[1],10)+'月' } : {day:'—',mon:''}; }

function parseNames(text){

    const m = s.match(/^(\d{1,3})[\s.、\-_:：]+(.+)$/);
    if (m) return { no: m[1], name: m[2].trim() };
    return { no: '', name: s };
  }).filter(x => x.name);
}

// Excel 解析逻辑
function handleExcelUpload(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      // 转成二维数组，遇到空单元格保留
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
      
      const items = [];
      let startRow = 0;
      
      // 智能判断是否有表头
      if (rows.length > 0) {
        const firstRowStr = rows[0].join('');
        if (firstRowStr.includes('姓名') || firstRowStr.includes('学号')) {
          startRow = 1;
        }
      }

      for (let i = startRow; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;
        
        let no = '', name = '';
        if (row.length >= 2) {
          // 假设第一列是学号，第二列是姓名
          no = String(row[0]).trim();
          name = String(row[1]).trim();
        } else if (row.length === 1) {
          // 只有一列，可能是 "01 张三" 或直接 "张三"
          const m = String(row[0]).match(/^(\d{1,3})[\s.、\-_:：]+(.+)$/);
          if (m) { no = m[1]; name = m[2].trim(); }
          else { name = String(row[0]).trim(); }
        }
        
        if (name) items.push({ no, name });
      }

      if (!items.length) return toast('未在Excel中解析到学生数据');
      
      const added = addStudents(items);
      toast(added === 0 ? '学生已存在' : `成功从Excel导入 ${added} 名学生`);
      loadStudents();
    } catch (err) {
      console.error(err);
      toast('Excel解析失败，请确保格式正确');
    }
  };
  reader.readAsArrayBuffer(file);
}

function updateProgress(){

  $('#ckProgressBar').style.width = pct + '%';
  $('#ckProgressText').innerHTML = `<span>已背 <b>${done}</b> / ${total}</span><span>未背 <b>${miss}</b></span><span>未记录 <b>${total - done - miss}</b></span><span>完成率 <b>${pct}%</b></span>`;

function renderOverview(d){
  const asgCount  = d.assignments.length;
  const stuCount  = d.students.length;
  const totalSlot = asgCount * stuCount;
  const done = d.students.reduce((a, s) => a + s.done, 0);
  const miss = d.students.reduce((a, s) => a + s.miss, 0);
  const rate = totalSlot ? Math.round(done / totalSlot * 100) : 0;
  
  $('#ovStats').innerHTML = `

  const daily = d.daily.slice().reverse();
  $('#ovDaily').innerHTML = `

      const t = x.done + x.miss + x.unmarked;
      const r = t ? Math.round(x.done / t * 100) : 0;
      return `<tr><td>${x.date}</td><td>${x.assignments}</td><td class="c-ok">${x.done}</td><td class="c-no">${x.miss}</td><td class="c-muted">${x.unmarked}</td><td><span class="mini-bar"><span style="width:${r}%"></span></span>${r}%</td></tr>`;
    }).join('') : '<tr><td colspan="6" class="empty">暂无记录</td></tr>'}</tbody>

  $('#ovStudents').innerHTML = `
    <thead><tr><th>学号</th><th>姓名</th><th>已背</th><th>未背</th><th>未记录</th><th>完成率</th></tr></thead>
    <tbody>${ stu.length ? stu.map(s => {
      const r = s.total ? Math.round(s.done / s.total * 100) : 0;
      return `<tr><td class="c-muted">${esc(s.no || '—')}</td><td style="font-weight:600;color:#0f172a">${esc(s.name)}</td><td class="c-ok">${s.done}</td><td class="c-no">${s.miss}</td><td class="c-muted">${s.total - s.done - s.miss}</td><td><span class="mini-bar"><span style="width:${r}%"></span></span>${r}%</td></tr>`;
    }).join('') : '<tr><td colspan="6" class="empty">暂无学生</td></tr>'}</tbody>

  const asg = d.assignments.slice().reverse();
  $('#ovAssignments').innerHTML = `
    <thead><tr><th>日期</th><th>篇目</th><th>已背</th><th>未背</th><th>未记录</th></tr></thead>
    <tbody>${ asg.length ? asg.map(a => `
      <tr><td class="c-muted">${a.date}</td><td style="font-weight:500">${esc(a.title)}</td><td class="c-ok">${a.done}</td><td class="c-no">${a.miss}</td><td class="c-muted">${a.total - a.done - a.miss}</td></tr>
    `).join('') : '<tr><td colspan="5" class="empty">暂无作业</td></tr>'}</tbody>
  `;
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      const data = obj.data || obj;
      if (!data || !Array.isArray(data.students)) throw new Error('格式不正确');
      if (!confirm('导入将覆盖当前所有班级及数据，确定吗？')) return;
      
      DB = data;
      // 修复兼容性
      if (!DB.classes) DB.classes = [{ id: 1, name: '默认班级' }];
      if (!DB.currentClassId) DB.currentClassId = DB.classes[0].id;
      if (!DB.seq) DB.seq = { class: 1, student: 0, assignment: 0 };
      
      saveDB(); toast('导入成功'); loadStudents(); $('#backupModal').hidden = true;
    } catch(e) { toast('导入失败：' + e.message); }
  };
  reader.readAsText(file);
}

/* ==================================================================
   初始化与事件绑定
   ================================================================== */
function init(){
  $$('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  renderClassSelect();

  // 班级切换
  $('#classSelect').addEventListener('change', e => {
    DB.currentClassId = Number(e.target.value);
    saveDB();
    // 重新加载当前视图
    const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
    switchTab(activeTab);
    toast('已切换至：' + DB.classes.find(c => c.id === DB.currentClassId).name);
  });

  // 班级管理
  $('#btnManageClasses').addEventListener('click', () => {
    renderClassManageList();
    $('#classModal').hidden = false;
  });
  $('#btnCloseClassModal').addEventListener('click', () => $('#classModal').hidden = true);
  $('#btnAddClass').addEventListener('click', () => {
    const name = $('#newClassName').value.trim();
    if (name) {
      addClass(name);
      $('#newClassName').value = '';
      renderClassManageList();
      renderClassSelect();
      toast('班级已添加');
    }
  });

  function renderClassManageList() {
    $('#classManageList').innerHTML = DB.classes.map(c => `
      <div class="class-manage-item">
        <span style="font-weight:600">${esc(c.name)}</span>
        ${DB.classes.length > 1 ? `<button class="btn btn-ghost btn-sm" style="color:var(--no)" onclick="deleteClassItem(${c.id})">删除</button>` : ''}
      </div>
    `).join('');
  }
  window.deleteClassItem = (id) => {
    if (confirm('删除班级将同时删除该班级下的所有学生、作业和打卡记录！确定吗？')) {
      if (deleteClass(id)) {
        renderClassManageList(); renderClassSelect();
        const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
        switchTab(activeTab);
        toast('班级已删除');
      }
    }
  };

  // 学生导入
  $('#btnImport').addEventListener('click', importStudents);
  $('#excelUpload').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) handleExcelUpload(file);
    e.target.value = ''; // 允许重复选择同一文件
  });
  
  // 学生删除
  $('#studentList').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act="del"]');
    if (!btn) return;
    const id = Number(btn.closest('.stu-item').dataset.id);
    if (confirm('确定删除该学生？记录也会一并删除。')) {
      deleteStudent(id); toast('已删除'); loadStudents();
    }
  });

  // 作业
  $('#asDate').value = today();
  $('#btnCreate').addEventListener('click', createAssignment);
  $('#assignmentList').addEventListener('click', e => {
    const delBtn = e.target.closest('button[data-act="del-as"]');
    if (delBtn) {
      const id = Number(delBtn.closest('.as-item').dataset.id);
      if (confirm('确定删除该作业？打卡记录也会删除。')) {
        deleteAssignment(id); toast('已删除'); loadAssignments();
      }
      return;
    }
    const openBtn = e.target.closest('button[data-act="open"]');
    if (openBtn) openAssignment(Number(openBtn.closest('.as-item').dataset.id));
  });

  // 打卡页
  $('#btnBack').addEventListener('click', () => { $('#paneList').hidden = false; $('#paneCheck').hidden = true; });
  $('#ckList').addEventListener('click', e => {
    const btn = e.target.closest('button[data-status]');
    if (!btn) return;
    const row = btn.closest('.check-row');
    const sid = Number(row.dataset.id);
    const want = btn.dataset.status;
    const stu = state.current.students.find(s => s.id === sid);
    if (!stu) return;
    const next = (stu.status === want) ? null : want;
    stu.status = next;
    row.querySelector('.check-btn.done').classList.toggle('active', next === 'done');
    row.querySelector('.check-btn.miss').classList.toggle('active', next === 'miss');
    updateProgress();
    setRecord(state.current.assignment.id, sid, next);
  });
  $('#btnMarkAllDone').addEventListener('click', () => {
    const st = state.current.students;
    const ids = st.filter(s => s.status !== 'done').map(s => s.id);
    if (!ids.length) return toast('所有人都已标记');
    if (!confirm(`将 ${ids.length} 名未标记的学生记为「已背」？`)) return;
    bulkRecord(state.current.assignment.id, ids, 'done');
    st.forEach(s => { if (ids.includes(s.id)) s.status = 'done'; });
    renderCheckin(); toast('已全部标记');
  });

  // 总览
  $$('.range-btn').forEach(b => b.addEventListener('click', () => setRange(b.dataset.range)));
  $('#btnCustom').addEventListener('click', () => {
    state.range = 'custom'; $$('.range-btn').forEach(b => b.classList.remove('active'));
    loadOverview();
  });
  $('#ovFrom').value = monthStart(); $('#ovTo').value = today();

  // 备份
  $('#btnBackup').addEventListener('click', openBackupModal);
  $('#btnCloseModal').addEventListener('click', () => $('#backupModal').hidden = true);
  $('#btnExport').addEventListener('click', exportBackup);
  $('#fileImport').addEventListener('change', e => {
    if (e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = '';
  });

  loadStudents();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
